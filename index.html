<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OBS Livechat - Cyber Police Theme - Social Stream Ninja Integration">
    <title>OBS Livechat</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/message.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="header-content">
                <div class="header-badge">🛡️</div>
                <div class="header-text">
                    <div class="header-title">SGT <span>:: STF OVERWATCH</span></div>
                    <div class="header-subtitle">
                        <span class="status-dot" id="statusDot"></span>
                        <span class="status-text" id="statusText">APEX-09 // INTERCOM</span>
                    </div>
                </div>
                <div class="rec-badge">REC ●</div>
            </div>
        </div>

        <div id="errorBanner" class="error-banner" style="display: none;"></div>

        <div class="chat-container cyber-grid" id="chatContainer"></div>

        <div class="footer">
            <span>SYS.ONLINE</span>
            <span class="footer-time" id="footerTime"></span>
        </div>

        <div class="scanlines"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/message.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
